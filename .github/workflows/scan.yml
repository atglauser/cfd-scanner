name: Daily scan

on:
  schedule:
    - cron: "30 6 * * 1-5"   # 06:30 UTC, Monday to Friday (GitHub may start it late)
  workflow_dispatch:          # manual "Run workflow" button

permissions:
  contents: write   # commit the day's scan to docs/data
  pages: write
  id-token: write

concurrency:
  group: scan-and-pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Fails (and publishes nothing) if under 80% of markets download,
      # so the site keeps showing the last good scan.
      - name: Run scanner
        run: |
          python cfd_scanner.py --account 1000 --risk 2 --workers 3 --min-ok 0.8 \
            --out "$RUNNER_TEMP/scans" --json docs/data/latest.json > /dev/null
          mkdir -p docs/data/history
          cp docs/data/latest.json "docs/data/history/$(date -u +%F).json"

      # The daily commit also keeps the schedule alive: GitHub disables
      # scheduled workflows in public repos after 60 days without activity.
      - name: Commit scan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "scan $(date -u +%F)" || echo "nothing to commit"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
